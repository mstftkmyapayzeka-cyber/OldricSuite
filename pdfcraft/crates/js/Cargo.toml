[package]
name = "pdfcraft-js"
description = "Acrobat JavaScript: a sandboxed interpreter (boa) with the form object model subset (event, getField, app, util, console)"
version = "0.7.1"
edition.workspace = true
license.workspace = true
rust-version = "1.95"
repository = "https://github.com/storytold/pdfcraft"

[lints]
workspace = true

[dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { version = "0.22.0", default-features = false, features = ["annex-b", "js"] }
